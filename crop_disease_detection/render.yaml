services:
  - type: web
    name: cropcare
    runtime: python
    plan: 1c-2g
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: DATABASE_PATH
        value: /var/data/crop_disease.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: cropcare-data
      mountPath: /var/data
      sizeGB: 5
